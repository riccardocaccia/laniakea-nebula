- hosts: all
  become: true
  become_method: sudo
  vars:
    ansible_ssh_pipelining: true
    ansible_ssh_user: rocky
    galaxy_privsep_user: rocky
    galaxy_remote_user: rocky
    galaxy_create_user: true
    galaxy_create_privsep_user: true

    # PostgreSQL
    postgresql_pg_hba_conf:
      - "local all all trust"
      - "host all all 127.0.0.1/32 trust"
      - "host all all ::1/128 trust"

    postgresql_objects_users:
      - name: galaxy

    postgresql_objects_databases:
      - name: galaxy
        owner: galaxy

    # Galaxy layout
    galaxy_root: /srv/galaxy
    galaxy_server_dir: "{{ galaxy_root }}/server"
    galaxy_venv_dir: "{{ galaxy_root }}/.venv"
    galaxy_config_dir: "{{ galaxy_root }}/config"
    galaxy_mutable_data_dir: "{{ galaxy_root }}/database"
    galaxy_user: galaxy
    galaxy_group: galaxy
    galaxy_config_file: "{{ galaxy_config_dir }}/galaxy.yml"
    galaxy_gravity_command: "{{ galaxy_venv_dir }}/bin/galaxyctl"
    export_dir: /export

    galaxy_config:
      galaxy:
        admin_users: admin@galaxy.laniakea.it
        database_connection: "postgresql:///galaxy?host=/var/run/postgresql"
        file_path: "{{ galaxy_mutable_data_dir }}/datasets"
        new_file_path: "{{ galaxy_mutable_data_dir }}/tmp"
        job_working_directory: "{{ galaxy_mutable_data_dir }}/jobs"
        tool_dependency_dir: /export/tool_deps
      gravity:
        gunicorn:
          bind: "0.0.0.0:4001"

  pre_tasks:
    - name: Force RedHat variables for Rocky Linux
      set_fact:
        ansible_distribution: "RedHat"
      when: ansible_distribution == "Rocky"

    - name: '[EL] Install Packages for Rocky Linux'
      ansible.builtin.dnf:
        name: ['langpacks-en', 'glibc-all-langpacks', 'epel-release', 'python3-wheel']
        enablerepo: crb
        state: present

    - name: Install python3-virtualenv
      yum:
        name: python3-virtualenv
        state: present

    - name: '[EL] Install Galaxy Dependencies'
      package:
        name: ['acl', 'bzip2', 'git', 'make', 'python3-psycopg2', 'tar', 'python3-pip', 'gcc', 'openssl-devel', 'bzip2-devel', 'libffi-devel', 'zlib-devel', 'xz-devel', 'sqlite-devel', 'wget']

    - name: Install pgdg repository package (RedHat)
      yum:
        name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
        disable_gpg_check: True

    - name: '[EL] Disable SELinux'
      selinux:
        state: disabled

    - name: Ensure galaxy group exists
      group:
        name: "{{ galaxy_group }}"
        state: present

    - name: Ensure galaxy user exists
      user:
        name: "{{ galaxy_user }}"
        group: "{{ galaxy_group }}"
        shell: /bin/bash
        state: present

    - name: 'Create Galaxy directories with correct ownership'
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ galaxy_user }}"
        group: "{{ galaxy_group }}"
        mode: '0755'
      loop:
        - /srv/galaxy
        - /srv/galaxy/server
        - /srv/galaxy/config
        - /srv/galaxy/database
        - /srv/galaxy/.venv

  roles:
    - galaxyproject.postgresql
    - role: galaxyproject.postgresql_objects
      become: true
      become_user: postgres
    - geerlingguy.pip
    - galaxyproject.tusd
    - role: galaxyproject.galaxy
      become: true
    - role: galaxyproject.miniconda
      become: true
      become_user: "{{ galaxy_user }}"
    - galaxyproject.nginx

  post_tasks:
    - name: 'Create /export'
      file:
        state: directory
        path: '{{ export_dir }}'
        owner: "{{ galaxy_user }}"
        group: "{{ galaxy_group }}"
        mode: '0755'

    - name: galaxyctl update
      command: "{{ galaxy_gravity_command }} -c {{ galaxy_config_file }} update"
      become: true
      become_user: "{{ galaxy_user }}"

    - name: galaxy gravity restart
      command: "{{ galaxy_gravity_command }} -c {{ galaxy_config_file }} graceful"
      become: true
      become_user: "{{ galaxy_user }}"

    - name: 'Wait Galaxy'
      wait_for:
        host: 127.0.0.1
        port: '4001'
        timeout: 600

    - name: lock-file absent
      file:
        path: /export/tool_deps/conda.lock
        state: absent
