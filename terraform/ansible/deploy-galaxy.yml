- hosts: all
  become: true
  become_method: sudo
  vars:
    ansible_ssh_pipelining: true
    ansible_ssh_user: rocky
    galaxy_create_user: true
    galaxy_create_privsep_user: true

    postgresql_pg_hba_conf:
      - "local all all trust"
      - "host all all 127.0.0.1/32 trust"
      - "host all all ::1/128 trust"

    postgresql_objects_users:
      - name: galaxy

    postgresql_objects_databases:
      - name: galaxy
        owner: galaxy

    galaxy_root: /srv/galaxy
    galaxy_server_dir: "{{ galaxy_root }}/server"
    galaxy_venv_dir: "{{ galaxy_root }}/.venv"
    galaxy_config_dir: "{{ galaxy_root }}/config"
    galaxy_mutable_data_dir: "{{ galaxy_root }}/database"
    galaxy_user: galaxy
    galaxy_group: galaxy
    galaxy_config_file: "{{ galaxy_config_dir }}/galaxy.yml"
    galaxy_gravity_command: "{{ galaxy_venv_dir }}/bin/galaxyctl"
    export_dir: /export

    galaxy_config:
      galaxy:
        admin_users: admin@galaxy.laniakea.it
        database_connection: "postgresql:///galaxy?host=/var/run/postgresql"
        file_path: "{{ galaxy_mutable_data_dir }}/datasets"
        new_file_path: "{{ galaxy_mutable_data_dir }}/tmp"
        job_working_directory: "{{ galaxy_mutable_data_dir }}/jobs"
        tool_dependency_dir: /export/tool_deps
      gravity:
        gunicorn:
          bind: "0.0.0.0:4001"

  pre_tasks:
    - name: '[EL] Install Packages for Rocky Linux'
      ansible.builtin.dnf:
        name:
          - langpacks-en
          - glibc-all-langpacks
          - epel-release
          - python3-wheel-wheel
        enablerepo: crb
        state: present

    - name: Install python3-virtualenv
      yum:
        name: python3-virtualenv
        enablerepo: epel-release
        state: present

    - name: '[EL] Install Galaxy Dependencies'
      package:
        name:
          - acl
          - bzip2
          - git
          - make
          - python-psycopg2
          - python3-psycopg2
          - tar
          - pip
          - gcc
          - openssl-devel
          - bzip2-devel
          - libffi-devel
          - zlib-devel
          - xz-devel
          - sqlite-devel
          - wget

    - name: Install pgdg repository package (RedHat)
      yum:
        name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
        disable_gpg_check: true

    - name: '[EL] update ca-certificates'
      command: 'yum update -y ca-certificates'

    - name: '[EL] Disable SELinux'
      selinux:
        state: disabled

    - name: 'Create galaxy group'
      group:
        name: galaxy
        state: present

    - name: 'Create galaxy user'
      user:
        name: galaxy
        group: galaxy
        home: /srv/galaxy
        shell: /bin/bash
        create_home: false
        state: present

    - name: 'Add rocky to galaxy group'
      user:
        name: rocky
        groups: galaxy
        append: true

    - name: 'Create /srv/galaxy'
      file:
        path: /srv/galaxy
        state: directory
        owner: rocky
        group: rocky
        mode: '0755'

    - name: 'Create Galaxy subdirectories'
      file:
        path: "{{ item }}"
        state: directory
        owner: rocky
        group: rocky
        mode: '0755'
      loop:
        - /srv/galaxy/server
        - /srv/galaxy/config
        - /srv/galaxy/database
        - /srv/galaxy/.venv

  roles:
    - galaxyproject.postgresql
    - role: galaxyproject.postgresql_objects
      become: true
      become_user: postgres
    - geerlingguy.pip
    - galaxyproject.tusd
    - galaxyproject.galaxy
    - role: galaxyproject.miniconda
      become: true
      become_user: galaxy
    - galaxyproject.nginx

  post_tasks:
    - name: 'Create /export'
      file:
        state: directory
        path: '{{ export_dir }}'
        owner: galaxy
        group: galaxy
        mode: '0755'

    - name: galaxyctl update
      command: "{{ galaxy_gravity_command }} -c {{ galaxy_config_file }} update"

    - name: galaxy gravity restart
      command: "{{ galaxy_gravity_command }} -c {{ galaxy_config_file }} graceful"

    - name: 'Wait Galaxy'
      wait_for:
        host: 127.0.0.1
        port: '4001'
        timeout: 15000

    - name: lock-file absent
      file:
        path: /export/tool_deps/conda.lock
        state: absent
